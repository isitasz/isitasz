<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="divider">
<defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#FF8AD1" stop-opacity="0"/><stop offset=".5" stop-color="#FF8AD1" stop-opacity=".85"/><stop offset="1" stop-color="#FF8AD1" stop-opacity="0"/></linearGradient></defs>
<style>
.cur{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.sway{animation:sw 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.blink{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eq{animation:eq 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.prog{animation:pg 14s linear infinite;transform-box:fill-box;transform-origin:left center}
@keyframes pg{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.cur,.tw,.sway,.bob,.blink,.eq,.prog{animation:none}}
</style>
<rect x="0" y="13" width="1000" height="2" fill="url(#d)"/>
<rect x="470" y="12" width="2" height="4" fill="#FF8AD1" fill-opacity="0.70"/><rect x="530" y="12" width="2" height="4" fill="#FF8AD1" fill-opacity="0.70"/><rect x="456" y="10" width="2" height="8" fill="#FF8AD1" fill-opacity="0.58"/><rect x="544" y="10" width="2" height="8" fill="#FF8AD1" fill-opacity="0.58"/><rect x="442" y="12" width="2" height="4" fill="#FF8AD1" fill-opacity="0.46"/><rect x="558" y="12" width="2" height="4" fill="#FF8AD1" fill-opacity="0.46"/><rect x="428" y="10" width="2" height="8" fill="#FF8AD1" fill-opacity="0.34"/><rect x="572" y="10" width="2" height="8" fill="#FF8AD1" fill-opacity="0.34"/>
<path class="tw" style="animation-delay:0s" d="M500 2 Q500 14 512 14 Q500 14 500 26 Q500 14 488 14 Q500 14 500 2Z" fill="#FF8AD1"/>
</svg>